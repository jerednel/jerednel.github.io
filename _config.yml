# Site settings
title: "Jeremy Nelson"
description: "Agentic AI, local models, and test harnesses. Field notes from real systems."
baseurl: ""
url: "https://jerednel.github.io"
author:
  name: "Jeremy Nelson"
  email: "jerednel@gmail.com"

# Build settings
future: true
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Theme-inspired settings (custom CSS instead of gem theme)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .sass-cache

# Custom settings
github_username: jerednel
twitter_username: n3lson
show_excerpts: true
paginate: 10
